name: Self image (keyquota)

on:
  push:
    branches: [keyquota]
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'tryingmeow/new-api'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Write VERSION
        run: echo "v1.0.0-rc.51-keyquota-$(git rev-parse --short HEAD)" > VERSION

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/tryingmeow/new-api:keyquota
            ghcr.io/tryingmeow/new-api:keyquota-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
